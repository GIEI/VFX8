name: Regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Portable contracts and demo builds
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portable regression gate
        shell: pwsh
        run: ./tests/run-regression.ps1 -PortableOnly
